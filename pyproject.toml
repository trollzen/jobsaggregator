[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobagg"
version = "0.1.0"
description = "Telegram job posts -> normalized table (Google Sheets / CSV)"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "pydantic>=2.6",
  "pyyaml>=6",
  "rapidfuzz>=3",
  "gspread>=6",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
telegram = ["telethon>=1.36"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
jobagg = "jobagg.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
