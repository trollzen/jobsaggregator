# Не мои роли: если есть слово отсюда и НЕТ ни одной моей роли (role_keywords) — пост отбрасывается.
# Если есть и то и другое — пост остаётся, в колонке «Роль (совпадение)» пометка «не моё: ...».
role_exclude:
  - "registered nurse, nursing staff, staff physician, attending physician, general practitioner,
    sales representative, medical representative, field sales, software engineer, backend, frontend,
    full stack, data engineer, ml engineer, devops, qa engineer"
  - "прием пациентов, приём пациентов, ведение пациентов, врач-терапевт, врач терапевт, врач-педиатр,
    медсестр*, медицинская сестра, медицинский представитель, медпред*, сертификат специалиста,
    аккредитация специалиста, разработчик, программист"

# Мой опыт: сколько слов отсюда есть в посте -> колонка «Приоритет» (простая замена Match без AI).
# Короткие латинские сокращения стоят в [скобках], иначе "AI" находился бы внутри "email", "MD" — в "cmd".
my_experience:
  - "oncology, precision oncology, [NGS], sequencing, biomarker, genomic, clinical trial, trial matching,
    eligibility, patient recruitment, feasibility, clinical data, abstraction, annotation, real-world,
    NCCN, guidelines, [AI], [LLM], machine learning, [NLP], automation, product owner, requirements,
    user stories, backlog, Jira, Agile, Scrum, project manager, delivery, stakeholder, team lead, [GCP],
    physician, [MD], medical degree, remote, Armenia, Yerevan"
  - "онколог*, геном*, биомаркер*, клинические исследования, разметк*, требования, бэклог, удален*, удалён*,
    Армения, Ереван, врач"
priority:
  high_from: 3                 # столько совпадений и больше = «высокий»; от 1 = «средний»; 0 = пусто

ai:
  mode: "off"                  # off | hybrid (этап 5)
  model: claude-haiku-5-5
  monthly_budget_usd: 5

dedupe:
  fuzzy_threshold: 92
  window_days: 30

store:
  type: sheets                 # csv | sheets
  csv_path: out/jobs.csv
  state_path: out/state.json   # только для csv
  sheet_tab: Вакансии          # для sheets; SHEET_ID и GOOGLE_SA_JSON из окружения
  state_tab: _state

health:
  fail_if_no_posts: true       # все каналы вернули 0 постов -> ошибка запуска
