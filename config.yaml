# Закрытые каналы: через Telegram API (Telethon), запуск с твоего компьютера.
# Список с id печатает scripts/tg_login.py. TG_API_ID и TG_API_HASH лежат в .env
telethon:
  session: tg.session
  channels:
    # веб-версия закрыта, владелец состоит (id из scripts/tg_login.py)
    - {name: "projects_jobs_feed", id: -1001229149302}
    # products_jobs и projects_jobs убраны по решению владельца (2026-11-08): группы с болтовнёй
    - {name: "findmyremote_product", id: -1002337083766}

fetch:
  max_posts_per_channel: 200   # ограничение бэкфилла при первом запуске
  backfill_days: 30            # первый запуск нового канала: не старше 30 дней
  timeout_s: 20
  delay_s: 1.5                 # пауза между запросами страниц

# Грубый префильтр без AI
prefilter:
  min_length: 80
  include_keywords:            # хотя бы одно слово должно быть в посте
    - ваканси                  # вакансия, вакансии, вакансий
    - ищем
    - требуется
    - открыта позиция
    - зарплата
    - зп
    - hiring
    - vacancy
    - we are looking
    - position
    - salary
    - job
    - remote
    - удален
    - откликнуться
    - резюме присылайте
  exclude_keywords:            # явные не-вакансии
    - "#резюме"
    - "#ищуработу"
    - "ищу работу"
    - "#cv"
    - "open to work"
    - реклама
    - "#промо"
    - "t.me/addlist"           # реклама «папок» с каналами
    - "забрать папку"

# Фильтры 2 «Сфера» и 3 «Роль» (после префильтра), только ключевые слова, без AI.
# В одной строке можно перечислить несколько слов через запятую. Как искать:
#   [слово]  только отдельным словом ("[PM]" не находит "npm"; "5 pm" тоже не PM)
#   слово*   начало слова ("клиник*" находит "клиника", "клиникой")
#   прочее   фраза целиком в любом месте текста
# Регистр не важен, «ё» = «е», дефис = пробел. Пустой список выключает фильтр.

# 2. Сфера: пост проходит, если есть хотя бы одно слово отсюда
domain_keywords:
  # EN, общие
  - "healthcare, health care, healthtech, health tech, health-tech, digital health, medtech, med tech,
    medical, medicine, clinical, clinic, clinics, hospital, hospitals, patients, patient care, patient data,
    patient experience, physician, physicians, nurse, nursing, care provider, provider network, payer,
    health plan, telemedicine, telehealth, mhealth, ehealth, diagnostics, diagnostic, laboratory, imaging,
    radiology, oncology, cardiology, dental, femtech, mental health platform"
  # EN, pharma и biotech
  - "pharma, pharmaceutical, pharmaceuticals, biopharma, drug development, drug discovery, drug safety,
    pharmacovigilance, pharmacy, biotech, biotechnology, life science, life sciences, biologics, genomics,
